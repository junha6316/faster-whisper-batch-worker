name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # GPU도 모델도 필요 없다. conftest가 runpod / faster_whisper를 스텁으로 채운다.
      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests -q
